version: '3.8'

services:
  mcp-server:
    image: ghcr.io/roddsrod/mcp-integration-suite:latest
    container_name: mcp-integration-suite
    stdin_open: true
    tty: false
    env_file:
      - .env
    user: mcp
    network_mode: bridge
    volumes:
      - ./mcp:/app  # Full access to entire MCP folder
